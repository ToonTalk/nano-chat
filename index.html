<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nano Chat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%230f766e' d='M12 8h40a8 8 0 0 1 8 8v24a8 8 0 0 1-8 8H30L16 60V48h-4a8 8 0 0 1-8-8V16a8 8 0 0 1 8-8z'/%3E%3Cpath fill='%23fff' d='M32 13l4.2 10.8L47 28l-10.8 4.2L32 43l-4.2-10.8L17 28l10.8-4.2z'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f7f6f3; --panel: #ffffff; --side: #efede8; --ink: #1f2328; --muted: #6b7280; --line: #dedbd3;
  --accent: #0f766e; --accent-ink: #ffffff; --accent-soft: #d9efec; --user: #e3f1ef; --chip: #f1efea;
  --warn: #b45309; --code: #f3f1ec; --shadow: 0 8px 30px rgba(0,0,0,.14);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17191c; --panel: #1f2226; --side: #131517; --ink: #e7e9ec; --muted: #9aa3ad; --line: #32363c;
    --accent: #2dd4bf; --accent-ink: #06201d; --accent-soft: #143b37; --user: #1d3a37; --chip: #282c31;
    --warn: #fbbf24; --code: #262a2f; --shadow: 0 8px 30px rgba(0,0,0,.5);
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; }
#app { display: grid; grid-template-columns: 260px 1fr; height: 100%; }
aside { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 16px 16px 10px; font-weight: 650; font-size: 18px; }
.brand svg { width: 26px; height: 26px; }
.sideBtn { display: flex; align-items: center; gap: 8px; width: calc(100% - 20px); margin: 4px 10px; padding: 9px 12px; background: transparent; border: 1px solid transparent; border-radius: 10px; text-align: left; }
.sideBtn:hover { background: var(--chip); }
#newChat { border-color: var(--line); background: var(--panel); }
#chatList { flex: 1; overflow-y: auto; padding: 6px 0; }
.chatItem { display: flex; align-items: center; margin: 2px 10px; border-radius: 10px; }
.chatItem button.open { flex: 1; min-width: 0; padding: 8px 12px; background: none; border: 0; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 10px; }
.chatItem.on { background: var(--accent-soft); }
.chatItem:hover { background: var(--chip); }
.chatItem.on:hover { background: var(--accent-soft); }
.chatItem button.del { visibility: hidden; background: none; border: 0; color: var(--muted); padding: 4px 10px; }
.chatItem:hover button.del { visibility: visible; }
.sideFoot { border-top: 1px solid var(--line); padding: 6px 0 10px; }
.count { color: var(--muted); font-size: 13px; }
main { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; }
header { display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-bottom: 1px solid var(--line); min-height: 54px; }
header h1 { flex: 1; min-width: 0; margin: 0; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#menuBtn { display: none; background: none; border: 0; font-size: 20px; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); font-size: 13px; color: var(--muted); white-space: nowrap; }
.pill:hover { color: var(--ink); }
.bar { width: 64px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.bar.hot i { background: var(--warn); }
#scroll { flex: 1; overflow-y: auto; min-height: 0; }
#thread { max-width: 780px; margin: 0 auto; padding: 22px 18px 10px; }
.msg { margin: 0 0 18px; }
.msg.user { display: flex; flex-direction: column; align-items: flex-end; }
.msg.user .bubble { background: var(--user); padding: 10px 14px; border-radius: 16px 16px 4px 16px; max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.bot .body { overflow-wrap: anywhere; }
.body > :first-child { margin-top: 0; } .body > :last-child { margin-bottom: 0; }
.body p { margin: .55em 0; } .body h1, .body h2, .body h3, .body h4 { margin: .9em 0 .4em; line-height: 1.25; }
.body h1 { font-size: 1.3em; } .body h2 { font-size: 1.18em; } .body h3, .body h4 { font-size: 1.05em; }
.body ul, .body ol { margin: .5em 0; padding-left: 1.5em; } .body li.d1 { margin-left: 1.4em; } .body li.d2 { margin-left: 2.8em; }
.body code { background: var(--code); padding: .1em .35em; border-radius: 5px; font: .9em ui-monospace, Consolas, monospace; }
.body pre { background: var(--code); padding: 12px 14px; border-radius: 10px; overflow-x: auto; } .body pre code { background: none; padding: 0; }
.body blockquote { margin: .6em 0; padding: .1em 1em; border-left: 3px solid var(--line); color: var(--muted); }
.body table { border-collapse: collapse; margin: .6em 0; display: block; overflow-x: auto; } .body th, .body td { border: 1px solid var(--line); padding: 5px 10px; text-align: left; }
.body a { color: var(--accent); } .body hr { border: 0; border-top: 1px solid var(--line); margin: 1em 0; }
a.cite { display: inline-block; min-width: 1.5em; padding: 0 .35em; margin: 0 .1em; font-size: .75em; text-align: center; text-decoration: none; background: var(--accent-soft); color: var(--ink); border-radius: 999px; vertical-align: .15em; }
.steps { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; align-items: flex-start; }
details.step { background: var(--chip); border-radius: 12px; font-size: 14px; max-width: 100%; }
details.step summary { list-style: none; cursor: pointer; padding: 6px 12px; display: flex; gap: 8px; align-items: center; overflow-wrap: anywhere; }
details.step summary::-webkit-details-marker { display: none; }
details.step summary::after { content: "▸"; color: var(--muted); margin-left: 2px; } details.step[open] summary::after { content: "▾"; }
details.step.err { color: var(--warn); }
details.step .more { padding: 2px 12px 10px; color: var(--muted); }
details.step pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 300px; overflow: auto; background: var(--panel); padding: 10px; border-radius: 8px; font: 12.5px/1.45 ui-monospace, Consolas, monospace; color: var(--ink); margin: 6px 0 0; }
.undo { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 1px 10px; font-size: 13px; }
.status { color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 8px; margin: 4px 0; }
.spin { width: 13px; height: 13px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.sources { margin-top: 10px; font-size: 13.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; }
.sources a { color: var(--ink); text-decoration: none; background: var(--chip); padding: 2px 10px; border-radius: 999px; max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sources a:hover { background: var(--accent-soft); }
.att { display: inline-flex; gap: 6px; align-items: center; background: var(--chip); border-radius: 10px; padding: 4px 10px; font-size: 13.5px; margin: 0 0 6px 6px; }
.att button { background: none; border: 0; color: var(--muted); padding: 0 2px; } .att .thumb { width: 34px; height: 34px; object-fit: cover; border-radius: 6px; }
.composerWrap { position: relative; } #attMenu { position: absolute; left: 0; bottom: calc(100% - 6px); z-index: 5; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 4px; }
#attMenu button { background: none; border: 0; border-radius: 8px; padding: 8px 12px; text-align: left; color: var(--ink); font: inherit; } #attMenu button:hover { background: var(--chip); }
.msg.user .media { max-width: 85%; margin: 0 0 6px; display: flex; flex-direction: column; align-items: flex-end; } .msg.user .pic { max-width: min(100%, 320px); max-height: 320px; border-radius: 12px; border: 1px solid var(--line); display: block; }
.msg.user audio { max-width: 100%; height: 40px; } details.saw { font-size: 13px; color: var(--muted); margin-top: 3px; max-width: 320px; } details.saw summary { cursor: pointer; text-align: right; } details.saw p { margin: 4px 0 0; }
.cam { width: 100%; max-height: 50vh; border-radius: 12px; background: #000; display: block; object-fit: contain; } .recClock { font-size: 34px; font-variant-numeric: tabular-nums; text-align: center; margin: 10px 0; }
.divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; margin: 6px 0 20px; }
.divider::before, .divider::after { content: ""; flex: 1; border-top: 1px dashed var(--line); }
.divider details { max-width: 70%; } .divider summary { cursor: pointer; } .divider p { margin: 6px 0 0; }
.stopped { color: var(--muted); font-size: 13px; font-style: italic; }
.welcome { text-align: center; padding: 8vh 10px 0; }
.welcome h2 { font-size: 26px; margin: 12px 0 6px; } .welcome p { color: var(--muted); margin: 0 auto 20px; max-width: 520px; }
.welcome svg { width: 56px; height: 56px; }
.tries { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 600px; margin: 0 auto; }
.tries button { text-align: left; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.tries button:hover { border-color: var(--accent); }
.tries small { display: block; color: var(--muted); }
.door { max-width: 520px; margin: 10vh auto 0; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 26px; text-align: center; }
.door h2 { margin: 0 0 8px; } .door p { color: var(--muted); margin: 8px 0; } .door ul { text-align: left; color: var(--muted); }
.big { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 11px 20px; font-weight: 600; margin-top: 10px; }
progress { width: 100%; height: 10px; accent-color: var(--accent); }
footer { padding: 6px 18px 12px; }
.composerWrap { max-width: 780px; margin: 0 auto; }
.composer { display: flex; align-items: flex-end; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 8px 8px 8px 6px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
.composer:focus-within { border-color: var(--accent); }
.composer textarea { flex: 1; border: 0; outline: 0; resize: none; background: transparent; color: var(--ink); font: inherit; padding: 6px 4px; max-height: 200px; min-height: 28px; }
.icon { background: none; border: 0; border-radius: 10px; padding: 5px 9px; font-size: 18px; color: var(--muted); } .icon:hover { background: var(--chip); }
#sendBtn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 7px 16px; font-weight: 600; } #sendBtn:disabled { opacity: .45; cursor: default; }
.hint { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 7px; }
dialog { border: 1px solid var(--line); border-radius: 16px; background: var(--panel); color: var(--ink); padding: 0; width: min(640px, 94vw); max-height: 88vh; box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(0,0,0,.35); }
.dhead { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
.dhead h2 { flex: 1; margin: 0; font-size: 18px; } .dbody { padding: 16px 18px 20px; overflow-y: auto; }
.dbody p { margin: 0 0 12px; } .dbody .sub { color: var(--muted); font-size: 14px; }
.dbody label { display: block; margin: 12px 0 4px; font-weight: 600; font-size: 14px; }
.dbody input[type=text], .dbody input[type=password], .dbody textarea, .dbody select { width: 100%; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: inherit; }
.dbody textarea { min-height: 64px; resize: vertical; }
.radio { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; font-weight: 400 !important; } .radio small { display: block; color: var(--muted); }
.note { border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 10px; }
.note .row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; } .note .row input[type=text] { font-weight: 600; }
.note .row label { margin: 0; font-weight: 400; font-size: 13px; white-space: nowrap; display: flex; gap: 4px; align-items: center; }
.plain { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 7px 14px; } .plain.danger { color: var(--warn); border-color: var(--warn); }
.stack { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--line); margin: 10px 0 6px; }
.stack i { display: block; height: 100%; } .k1 { background: #7c6fd6; } .k2 { background: var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13.5px; color: var(--muted); margin-bottom: 12px; } .legend b { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; }
.dbody pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); padding: 12px; border-radius: 10px; font: 12.5px/1.5 ui-monospace, Consolas, monospace; max-height: 320px; overflow: auto; }
.toc { display: block; width: 100%; text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
.toc:hover { border-color: var(--accent); } .toc small { color: var(--muted); display: block; }
.body.raw { white-space: pre-wrap; }
.svgview { margin: .6em 0 .2em; } .svgview img { display: block; min-width: 140px; max-width: 100%; max-height: 420px; object-fit: contain; background: #fff; border: 1px solid var(--line); border-radius: 10px; }
.svgbar { font-size: 13px; margin-top: 4px; color: var(--muted); } .svgbar a { color: var(--muted); }
details.svgcode { margin: .2em 0 .7em; } details.svgcode summary { cursor: pointer; color: var(--muted); font-size: 13.5px; }
#micBtn.live { color: #dc2626; animation: pulse 1s ease-in-out infinite; } @keyframes pulse { 50% { opacity: .4; } }
.saved { max-width: 780px; margin: 0 auto; padding: 26px 18px 0; } .saved h1 { font-size: 22px; margin: 0 0 4px; } .saved p { color: var(--muted); font-size: 14px; margin: 0; }
.tools { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
.tool { background: none; border: 1px solid transparent; border-radius: 999px; padding: 2px 10px; font-size: 13px; color: var(--muted); }
.tool:hover { border-color: var(--line); color: var(--ink); background: var(--panel); }
.plain.sm { padding: 3px 12px; font-size: 13.5px; border-radius: 999px; }
.offs { font-size: 12.5px; color: var(--muted); margin-top: 6px; } .offs.goes { color: var(--warn); font-size: 13.5px; } .tool.carry { color: var(--accent); font-weight: 600; } .offs .try { font-size: inherit; }
.toldMore { margin-top: 8px; } .toldMore summary { cursor: pointer; color: var(--muted); font-size: 14px; } .toldMore pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; background: var(--code); border-radius: 10px; padding: 10px; margin: 6px 0 0; }
.toldState { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 6px; font-size: 13.5px; color: var(--muted); }
.nudge { margin-top: 10px; background: var(--accent-soft); border-radius: 12px; padding: 8px 12px; font-size: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.nudge span { flex: 1; min-width: 200px; }
.cmp { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 12px; }
.card { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; background: var(--panel); min-width: 0; }
.cap { display: flex; gap: 8px; align-items: baseline; font-size: 13px; color: var(--muted); margin-bottom: 8px; } .cap b { color: var(--ink); white-space: nowrap; } .cap span { flex: 1; }
.cap button { background: none; border: 0; color: var(--muted); padding: 0 2px; }
.check { margin-top: 8px; font-size: 13.5px; color: var(--muted); } .check.bad { color: var(--warn); }
.coach { margin-top: 10px; border: 1px solid var(--line); border-left: 3px solid #7c6fd6; border-radius: 12px; padding: 10px 12px; font-size: 14.5px; background: var(--panel); }
.coach .who { font-weight: 600; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.coach summary { cursor: pointer; color: var(--muted); font-size: 13.5px; margin-top: 6px; } .coach ul { margin: 8px 0; padding-left: 1.3em; } .coach p { margin: 6px 0; }
.talk { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 8px; }
.tmsg b { font-size: 12.5px; color: var(--muted); font-weight: 600; } .tmsg.you div { white-space: pre-wrap; } .tmsg p { margin: 2px 0; }
.ask { display: flex; gap: 8px; margin-top: 10px; align-items: flex-end; } .ask input, .ask textarea { flex: 1; min-width: 0; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font: inherit; resize: vertical; }
.cnote { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 13.5px; }
.coach .tools .sub { margin: 0; }
.coach q { font-style: italic; } .coach .said { color: var(--muted); margin-bottom: 4px; } .coach .sub { color: var(--muted); font-size: 12.5px; }
.badge { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; margin-right: 6px; background: var(--chip); color: var(--muted); }
.badge.good { background: #d1fae5; color: #065f46; } .badge.minor { background: #fef3c7; color: #92400e; } .badge.wrong { background: #fee2e2; color: #991b1b; }
mark.flaw { background: #fde68a; color: #1f2328; border-radius: 3px; padding: 0 2px; }
.group { margin: 16px 0 2px; font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
.part { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); font-weight: 400 !important; margin: 0 !important; }
.dbody label.part, .dbody label.radio { display: flex; }
.part input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.part .txt { flex: 1; } .part .txt b { font-weight: 600; } .part small { display: block; color: var(--muted); font-size: 13.5px; }
.part .moreTxt { color: var(--ink); background: var(--code); border-radius: 10px; padding: 8px 10px; margin: 6px 0 2px; line-height: 1.5; } .part .moreTxt .both { display: block; margin-top: 6px; color: var(--muted); } .part .try { margin-right: 14px; }
details.about { margin: 6px 0 2px; } details.about summary { cursor: pointer; color: var(--accent); font-size: 13.5px; text-decoration: underline; list-style: none; } details.about summary::-webkit-details-marker { display: none; } details.about p { background: var(--code); border-radius: 10px; padding: 8px 10px; margin: 6px 0 0; font-size: 13.5px; line-height: 1.5; }
.try { background: none; border: 0; color: var(--accent); padding: 0; font-size: 13.5px; text-align: left; text-decoration: underline; }
.welcome .more { margin-top: 18px; font-size: 14px; }
.row2 { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
#openParts.partial { border-color: var(--warn); color: var(--ink); }
.pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 14px; margin: 8px 0 12px; } .pgrid label { display: flex; gap: 8px; align-items: center; font-weight: 400; margin: 2px 0; font-size: 14.5px; }
@media (max-width: 760px) {
  .pill .wide { display: none; }
  .pgrid { grid-template-columns: 1fr; }
  #app { grid-template-columns: 1fr; }
  aside { position: fixed; inset: 0 auto 0 0; width: 270px; z-index: 5; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow); }
  body.menu aside { transform: none; }
  #menuBtn { display: block; }
  .tries { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><path fill="var(--accent)" d="M12 8h40a8 8 0 0 1 8 8v24a8 8 0 0 1-8 8H30L16 60V48h-4a8 8 0 0 1-8-8V16a8 8 0 0 1 8-8z"/><path fill="var(--accent-ink)" d="M32 13l4.2 10.8L47 28l-10.8 4.2L32 43l-4.2-10.8L17 28l10.8-4.2z"/></svg>Nano Chat</div>
    <button class="sideBtn" id="newChat">＋ New chat</button>
    <nav id="chatList" aria-label="Chats"></nav>
    <div class="sideFoot">
      <button class="sideBtn" id="openNotes">📒 Notes <span class="count" id="noteCount"></span></button>
      <button class="sideBtn" id="openSettings">⚙️ Settings</button>
    </div>
  </aside>
  <main>
    <header>
      <button id="menuBtn" aria-label="Chats">☰</button>
      <h1 id="chatTitle">New chat</h1>
      <button class="pill" id="openContents" hidden>📑 Contents <span id="tocCount"></span></button>
      <button class="pill" id="saveChat" title="Save this chat as a web page you can keep or share" hidden>⬇ <span class="wide">Save</span></button>
      <button class="pill" id="openParts" title="Switch the parts of this chatbot on and off">🧩 <span class="wide">Parts</span> <span id="partsCount"></span></button>
      <button class="pill" id="meter" title="What Nano can see right now">Memory <span class="bar"><i></i></span> <span id="meterPct">0%</span></button>
    </header>

  network: 'Speech recognition could not reach its service.', 'language-not-supported': 'Speech recognition for English is not installed.' };

// Reading a reply aloud uses the voices on this computer. Code, tables, pictures and citation numbers are left out.

// start
async function start(byClick) {
  try {
    if (!LM) { state.door = { kind: 'none' }; ui.thread(); return; }
    const a = await LM.availability(LM_OPTS);
    if (a === 'unavailable') { state.door = { kind: 'none', why: 'Chrome says this computer cannot run the model.' }; ui.thread(); return; }
    if (a !== 'available' && !byClick) { state.door = { kind: 'download' }; ui.thread(); return; }
    state.door = { kind: 'loading', pct: a === 'available' ? null : 0 }; ui.thread();
    await engine.init(p => { state.door.pct = p; if (!engine.ready) ui.thread(); });
    ui.thread(); ui.busy(); ui.meter(); input.focus();
  } catch (e) { console.error(e); state.door = { kind: 'error', why: e.message || String(e) }; ui.thread(); }
}
(async () => {
  try { state.chats = await db.all(); } catch (e) { console.warn(e); }
  for (const c of state.chats) for (const t of c.turns) for (const x of [t, ...(t.variants || [])]) {
    delete x.phase; (x.steps || []).forEach(s => { if (s.status === 'running') { s.status = 'error'; s.label = 'Interrupted'; } });
    if (x.coach && x.coach.state === 'loading') delete x.coach;
    if (x.role === 'assistant' && x.ms == null) x.ms = 0;
  }
  // A link can choose the starting point: ?start=bare switches every part off, ?start=full switches them all on.
  // It applies once and is then taken out of the address, so that a reload keeps whatever has been switched on since.
  const sp = params.get('start');
  if (sp === 'bare' || sp === 'full') {
    settings.features = defaultParts(sp === 'full'); saveSettings(); params.delete('start');
    try { history.replaceState(null, '', location.pathname + (params.toString() ? '?' + params : '') + location.hash); } catch {}
  }
  ui.parts(); ui.mic();
  const last = sp ? null : state.chats.find(c => c.id === settings.last && c.turns.length);
  $('#noteCount').textContent = notes.length ? notes.length : '';
  if (last) { state.chat = last; ui.chats(); ui.thread(); ui.title(); } else newChat();
